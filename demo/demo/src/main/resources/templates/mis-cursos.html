<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout1}">
<body>
    <div class="container mt-5" layout:fragment="contenido">
        <h2 class="text-center fw-bold mb-4">Estudiantes con Curso y Categoría</h2>
        <table class="table table-striped" border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Curso</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="estudiante : ${estudiantes}">
                    <td th:text="${estudiante.idEstudiante}"></td>
                    <td th:text="${estudiante.nombrePersona}"></td>
                    <td th:text="${estudiante.categoria}"></td>
                    <td th:text="${estudiante.curso}"></td>
                    <td>
                        <a th:href="@{/VerCurso}" class="btn btn-primary">Ver Curso</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
